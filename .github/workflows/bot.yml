name: SSK Bot

on:
  repository_dispatch:
    types: [ssk]
  workflow_dispatch:
    inputs:
      mode:
        description: "কী চালাবেন"
        type: choice
        options: [scan, prepare, upload]
        default: scan
      force:
        description: "prepare-এ সময় উইন্ডো না মেনে চালাবে (1 = হ্যাঁ)"
        type: string
        default: "0"

permissions:
  contents: write

concurrency:
  group: ssk-bot
  cancel-in-progress: false

env:
  APP_BRANCH: main
  APP_TOKEN: ${{ github.token }}
  APP_REPOSITORY: ${{ github.repository }}
  APP_WORK: work
  FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  YT_COOKIES: ${{ secrets.YT_COOKIES }}

jobs:
  scan:
    if: >-
      (github.event_name == 'repository_dispatch' && github.event.client_payload.mode == 'scan') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'scan')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp requests
      - name: yt-dlp স্ক্যান টেস্ট
        run: python bot.py scan

  prepare:
    if: >-
      (github.event_name == 'repository_dispatch' && github.event.client_payload.mode == 'prepare') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'prepare')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      APP_MODE: prepare
      APP_FORCE: ${{ github.event.client_payload.force || inputs.force || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: সরঞ্জাম ইনস্টল
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-extra fonts-noto-color-emoji
      - run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - run: python main.py

  upload:
    if: >-
      (github.event_name == 'repository_dispatch' && github.event.client_payload.mode == 'upload') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'upload')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      APP_MODE: upload
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py
