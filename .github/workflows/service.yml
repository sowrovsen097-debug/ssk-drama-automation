name: SSK Upload and Live Monitor

on:
  schedule:
    - cron: "0 * * * *"        # প্রতি ঘণ্টায় আপলোড সময় দেখে
    - cron: "*/20 * * * *"     # প্রতি ২০ মিনিটে স্টেটাস, AI উত্তর, ক্লিনআপ
  workflow_dispatch:
    inputs:
      mode:
        description: "কোন কাজ চালাবেন"
        type: choice
        options: [service, upload]
        default: service

permissions:
  contents: write
  actions: write

concurrency:
  group: ssk-service-${{ github.event.schedule || inputs.mode || 'manual' }}
  cancel-in-progress: false

env:
  APP_BRANCH: main
  APP_TOKEN: ${{ github.token }}
  APP_REPOSITORY: ${{ github.repository }}
  APP_WORK: work
  FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

jobs:
  upload:
    if: github.event.schedule == '0 * * * *' || inputs.mode == 'upload' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      APP_MODE: upload
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py

  observe:
    if: github.event.schedule == '*/20 * * * *' || inputs.mode == 'service'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_MODE: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install requests
      - run: python main.py
