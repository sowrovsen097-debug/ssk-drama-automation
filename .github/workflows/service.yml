name: SSK Upload and Live Monitor

on:
  schedule:
    # Hourly upload checks.
    - cron: '0 * * * *'

    # Live monitoring between hourly checks.
    - cron: '5-55/5 * * * *'

  workflow_dispatch:
    inputs:
      upload_only:
        description: Upload without running another observer
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

env:
  APP_TOKEN: ${{ github.token }}
  APP_REPOSITORY: ${{ github.repository }}
  APP_BRANCH: ${{ github.event.repository.default_branch }}

  FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

jobs:
  upload:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 * * * *'

    runs-on: ubuntu-latest
    timeout-minutes: 120

    concurrency:
      group: ssk-uploader
      cancel-in-progress: false

    env:
      APP_MODE: upload

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install requests google-api-python-client google-auth

      - run: python main.py

  observe:
    if: github.event_name != 'workflow_dispatch' || inputs.upload_only != true

    runs-on: ubuntu-latest
    timeout-minutes: 12

    concurrency:
      group: ssk-observer
      cancel-in-progress: false

    env:
      APP_MODE: service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install requests google-api-python-client google-auth

      - run: python main.py
