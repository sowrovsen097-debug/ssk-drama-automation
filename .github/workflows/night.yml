name: SSK Night Editing

on:
  schedule:
    - cron: "0 19-23 * * *"   # 01:00-05:00 BD
    - cron: "0 0 * * *"       # 06:00 BD (উইন্ডোর শেষ প্রান্ত)
  workflow_dispatch:
    inputs:
      force:
        description: "উইন্ডো না মেনে এখনই এডিট (1 = হ্যাঁ)"
        type: string
        default: "1"

permissions:
  contents: write

concurrency:
  group: ssk-night
  cancel-in-progress: false

env:
  APP_MODE: prepare
  APP_BRANCH: main
  APP_TOKEN: ${{ github.token }}
  APP_REPOSITORY: ${{ github.repository }}
  APP_WORK: work
  APP_FORCE: ${{ github.event.inputs.force || '0' }}
  FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  YT_COOKIES: ${{ secrets.YT_COOKIES }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: সরঞ্জাম
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-extra
      - name: ডিপেন্ডেন্সি
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: রাতের এডিটিং
        run: python main.py
