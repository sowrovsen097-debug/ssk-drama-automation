name: SSK Night Editing

on:
  schedule:
    - cron: "0 18-23 * * *"   # 00:00-05:59 BD  => শুধু 01:00-06:00 BD ভেতরে এডিট হয়
  workflow_dispatch:
    inputs:
      force:
        description: "সময় উইন্ডো না মেনে এখনই এডিট শুরু"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: ssk-night-editor
  cancel-in-progress: false

env:
  APP_MODE: prepare
  APP_BRANCH: main
  APP_TOKEN: ${{ github.token }}
  APP_REPOSITORY: ${{ github.repository }}
  APP_WORK: work
  FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  YT_COOKIES: ${{ secrets.YT_COOKIES }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: সরঞ্জাম ইনস্টল
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-extra fonts-noto-color-emoji
      - name: ডিপেন্ডেন্সি
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: সিনট্যাক্স যাচাই
        run: python -m compileall -q core.py main.py editor.py monitor.py subtitle_generator.py
      - name: রাতের এডিটিং
        env:
          APP_FORCE: ${{ inputs.force && '1' || '0' }}
          APP_BUDGET_SECONDS: "18000"
        run: python main.py
