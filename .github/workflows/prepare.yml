name: SSK Night Editing

on:
  schedule:
    # UTC 19:00-00:00 = BD 01:00-06:00.
    # 06:00 is a closing check, not a new editing window.
    - cron: '0 19-23,0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ssk-night-editor
  cancel-in-progress: false

env:
  APP_TOKEN: ${{ github.token }}
  APP_REPOSITORY: ${{ github.repository }}
  APP_BRANCH: ${{ github.event.repository.default_branch }}

  FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

  APP_MODE: prepare

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 295

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install FFmpeg and multilingual fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra

      - name: Install CPU editing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Check code and prepare night queue
        run: |
          python -m compileall -q core.py main.py editor.py monitor.py subtitle_generator.py
          python main.py
