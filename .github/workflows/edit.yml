name: 1) SSK Edit + Storage (01:00-06:00 BD)
on:
  schedule:
    # BD = UTC+6  →  01:00,02:00,03:00,04:00,05:00,06:00 BD = 19,20,21,22,23,00 UTC
    - cron: '0 19,20,21,22,23,0 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'ম্যানুয়াল: auto / fb / yt'
        required: false
        default: 'auto'

permissions:
  contents: write

concurrency:
  group: ssk-edit-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FFmpeg + বাংলা/হিন্দি ফন্ট
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-extra fonts-beng fonts-deva

      - name: Whisper মডেল ক্যাশ
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ssk-whisper
            ~/.cache/huggingface
          key: ssk-whisper-${{ hashFiles('config.json') }}

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt

      - name: Run Edit Pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANUAL_TARGET: ${{ github.event.inputs.target }}
        run: python main.py edit

      - name: State Commit & Push
        if: always()
        run: |
          git config --global user.name  'ssk-bot'
          git config --global user.email 'ssk-bot@users.noreply.github.com'
          git add -A history.json state.json status.json config.json chat.json telegram_offset.json 2>/dev/null || true
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore: edit state $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
          git push origin HEAD:${GITHUB_REF_NAME} || (git pull --rebase --autostash origin ${GITHUB_REF_NAME} && git push)
