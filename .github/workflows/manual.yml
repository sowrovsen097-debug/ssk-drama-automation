name: SSK Manual Upload

on:
  workflow_dispatch:
    inputs:
      source:
        description: "সোর্স: YouTube লিংক বা Google Drive ফাইল লিংক"
        required: true
        type: string
      platform:
        description: "কোথায় যাবে"
        required: true
        type: choice
        options: [youtube, facebook]
      time:
        description: "আপলোড সময় BD (ফাঁকা = এখনই; সর্বনিম্ন ৬ ঘণ্টা আগে হতে হবে)"
        required: false
        type: string
      title:
        description: "টাইটেল (ফাঁকা = অটো SEO)"
        required: false
        type: string
      description_text:
        description: "ডেসক্রিপশন (ফাঁকা = অটো SEO)"
        required: false
        type: string
      do_edit:
        description: "আগে এডিট করবে?"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ssk-manual
  cancel-in-progress: false

env:
  APP_MODE: manual
  APP_BRANCH: main
  APP_TOKEN: ${{ github.token }}
  APP_REPOSITORY: ${{ github.repository }}
  APP_WORK: work
  FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  YT_COOKIES: ${{ secrets.YT_COOKIES }}

jobs:
  manual:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-extra
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: ম্যানুয়াল কাজ
        env:
          MANUAL_SOURCE: ${{ inputs.source }}
          MANUAL_PLATFORM: ${{ inputs.platform }}
          MANUAL_TIME: ${{ inputs.time }}
          MANUAL_TITLE: ${{ inputs.title }}
          MANUAL_DESCRIPTION: ${{ inputs.description_text }}
          MANUAL_EDIT: ${{ inputs.do_edit && '1' || '0' }}
        run: python main.py
